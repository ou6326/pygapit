[build-system]
requires      = ["hatchling>=1.26,<1.30"]
build-backend = "hatchling.build"

[project]
name        = "pygapit-ng"
version     = "2.0.0rc1"
description = "Python implementation of GAPIT: Genome Association and Prediction Integrated Tool (GLM, MLM, CMLM, MLMM, FarmCPU, BLINK, gBLUP, cBLUP, sBLUP)"
readme      = "README.md"
license     = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [{ name = "Yiwu Ouyang" }, { name = "PyGAPIT Contributors" }]

keywords = [
    "GWAS",
    "genomics",
    "association-study",
    "plant-breeding",
    "mixed-model",
    "genomic-selection",
    "BLUP",
    "EMMA",
    "FarmCPU",
    "BLINK",
    "MLMM",
    "bioinformatics",
    "quantitative-genetics",
    "SNP",
    "kinship",
    "heritability",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy>=2.2.6,<3",
    "scipy>=1.15.3,<2",
    "pandas>=2.3.0,<4",
    "matplotlib>=3.9.0,<4",
    "plotly>=4.14.3,<8",
    "bokeh>=3.8.2,<3.11",
    "datashader>=0.17.0,<0.20",
    "holoviews>=1.23.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "rpy2>=3.6.7,<4",
    "black>=26.5.1,<27",
    "ruff>=0.16.8,<0.17",
    "pandas-stubs>=3.0.5,<4",
    "scipy-stubs>=1.17.1.5,<2",
    "pyrefly>=1.3.1,<2",
    "basedpyright>=1.39.10,<2",
]
bigdata = ["h5py>=3.16.0,<4", "zarr>=3.2.0,<4"]
styles = ["seaborn>=0.13.2,<0.14", "scienceplots>=2.2.2,<3"]

[project.urls]
Homepage = "https://github.com/ou6326/pygapit"
Documentation = "https://github.com/ou6326/pygapit#readme"
Changelog = "https://github.com/ou6326/pygapit/blob/main/CHANGELOG.md"
Source = "https://github.com/ou6326/pygapit"
"Bug Tracker" = "https://github.com/ou6326/pygapit/issues"

[project.scripts]
pygapit = "pygapit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pygapit"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/pygapit",
    "/tests",
    "/examples",
]

[tool.coverage.run]
parallel = true
source = ["pygapit"]

omit = ["*/.pixi/*"]

[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-v --tb=short"
filterwarnings = ["ignore::UserWarning"]

[tool.black]
line-length    = 100
target-version = ["py312", "py313", "py314"]

[tool.ruff.format]
preview = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pygapit-ng = { path = ".", editable = true }

[tool.pixi.dependencies]

[tool.pixi.tasks]
precommit = "ruff check --preview --ignore RUF069 && ruff format --check && basedpyright && pyrefly check -p all"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.lint.pypi-dependencies]
pytest = ">=9.1.1,<10"
ruff = ">=0.16.8,<0.17"
pandas-stubs = ">=3.0.5,<4"
scipy-stubs = ">=1.17.1.5,<2"
pyrefly = ">=1.3.1,<2"
basedpyright = ">=1.39.10,<2"

[tool.pixi.feature.smoke.pypi-dependencies]
pytest = ">=9.1.1,<10"

[tool.pixi.environments]
default = { features = ["py314", "dev", "bigdata", "styles"], solve-group = "py314" }
full312 = { features = ["py312", "dev", "bigdata", "styles"], solve-group = "py312" }
lint = { features = ["py314", "bigdata", "lint"], solve-group = "py314" }
smoke312 = { features = ["py312", "bigdata", "smoke"], solve-group = "py312" }

[tool.pyrefly]
project-includes = ["pygapit/**/*.py", "tests/**/*.py", "examples/**/*.py", "benchmarks/**/*.py"]
python-version = "3.14"

[tool.pyrefly.errors]
# NumPy, pandas, matplotlib, and argparse expose intentionally dynamic APIs.
# Keep Pyrefly's compatibility checks strict while avoiding diagnostics that
# only demand exhaustive annotations or discarded-result assignments.
explicit-any = false
unknown-argument-type = false
unknown-variable-type = false
implicit-any-parameter = false
unused-call-result = false
implicit-bool = false
implicit-any-type-argument = false
unannotated-return = false

[tool.basedpyright]
include = ["pygapit", "tests", "examples", "benchmarks"]
pythonVersion = "3.14"
reportUnknownMemberType = true
reportUnknownArgumentType = true
reportUnknownVariableType = true
reportUnknownParameterType = true
reportMissingParameterType = true
# Upper-case local names (X, GD, GM, K, …) are the established notation for
# matrices in statistical genetics; they are variables rather than constants.
reportConstantRedefinition = false
# Scientific Python and pytest expose deliberately dynamic APIs. Keep concrete
# compatibility diagnostics enabled while avoiding annotation-completeness noise.
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnusedParameter = false
reportUnnecessaryTypeIgnoreComment = false
reportPrivateUsage = false
reportImplicitStringConcatenation = false
reportUnreachable = false
