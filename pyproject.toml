[build-system]
requires      = ["hatchling>=1.26,<1.30"]
build-backend = "hatchling.build"

[project]
name        = "pygapit-ng"
version     = "1.2.2"
description = "Python implementation of GAPIT: Genome Association and Prediction Integrated Tool (GLM, MLM, CMLM, MLMM, FarmCPU, BLINK, gBLUP, cBLUP, sBLUP)"
readme      = "README.md"
license     = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"

authors = [{ name = "Yiwu Ouyang" }, { name = "PyGAPIT Contributors" }]

keywords = [
    "GWAS",
    "genomics",
    "association-study",
    "plant-breeding",
    "mixed-model",
    "genomic-selection",
    "BLUP",
    "EMMA",
    "FarmCPU",
    "BLINK",
    "MLMM",
    "bioinformatics",
    "quantitative-genetics",
    "SNP",
    "kinship",
    "heritability",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=2.2.6,<3",
    "scipy>=1.15.3,<2",
    "pandas>=2.3.3,<4",
    "matplotlib>=3.10.9,<4",
    "seaborn>=0.13.2,<0.14",
    "joblib>=1.6.0,<2",
    "plotly>=7.0.0,<8",
    "jinja2>=3.1.6,<4",
    "biopython>=1.88,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "rpy2>=3.6.7,<4",
    "black>=26.5.1,<27",
    "ruff>=0.16.6,<0.17",
    "pandas-stubs>=2.3.3.260113,<4",
    "scipy-stubs>=1.15.3.0,<2",
    "pyrefly>=1.2.0,<2",
    "basedpyright>=1.39.10,<2",
]
bigdata = ["h5py>=3.16.0,<4", "zarr>=2.18.3,<4", "dask[array]>=2026.8.0,<2027"]

[project.urls]
Homepage = "https://github.com/ou6326/pygapit"
Documentation = "https://github.com/ou6326/pygapit#readme"
Changelog = "https://github.com/ou6326/pygapit/blob/main/CHANGELOG.md"
Source = "https://github.com/ou6326/pygapit"
"Bug Tracker" = "https://github.com/ou6326/pygapit/issues"

[project.scripts]
pygapit = "pygapit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pygapit"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/pygapit",
    "/tests",
    "/examples",
]

[tool.coverage.run]
parallel = true
source = ["pygapit"]

omit = ["*/.pixi/*"]

[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-v --tb=short"
filterwarnings = ["ignore::UserWarning"]

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff.format]
preview = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pygapit-ng = { path = ".", editable = true }

[tool.pixi.dependencies]

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["py312"], solve-group = "py312" }
dev = { features = ["py312", "dev"], solve-group = "py312" }
bigdata = { features = ["py312", "bigdata"], solve-group = "py312" }
full = { features = ["py312", "dev", "bigdata"], solve-group = "py312" }

full310 = { features = ["py310", "dev", "bigdata"], solve-group = "py310" }

[tool.pyrefly]
project-includes = ["pygapit/**/*.py", "tests/**/*.py", "examples/**/*.py"]
python-version = "3.12"

[tool.pyrefly.errors]
# NumPy, pandas, matplotlib, and argparse expose intentionally dynamic APIs.
# Keep Pyrefly's compatibility checks strict while avoiding diagnostics that
# only demand exhaustive annotations or discarded-result assignments.
explicit-any = false
unknown-argument-type = false
unknown-variable-type = false
implicit-any-parameter = false
unused-call-result = false
implicit-bool = false
implicit-any-type-argument = false
unannotated-return = false

[tool.basedpyright]
include = ["pygapit", "tests", "examples"]
pythonVersion = "3.12"
reportUnknownMemberType = true
reportUnknownArgumentType = true
reportUnknownVariableType = true
reportUnknownParameterType = true
reportMissingParameterType = true
# Upper-case local names (X, GD, GM, K, …) are the established notation for
# matrices in statistical genetics; they are variables rather than constants.
reportConstantRedefinition = false
# Scientific Python and pytest expose deliberately dynamic APIs. Keep concrete
# compatibility diagnostics enabled while avoiding annotation-completeness noise.
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnusedParameter = false
reportUnnecessaryTypeIgnoreComment = false
reportPrivateUsage = false
reportImplicitStringConcatenation = false
