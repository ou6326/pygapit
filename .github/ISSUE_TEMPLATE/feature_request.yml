name: Feature request
description: Propose a focused improvement to pyGAPIT.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What scientific or engineering problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired API or behavior and a representative example.
    validations:
      required: true
  - type: textarea
    id: implications
    attributes:
      label: Scientific and compatibility implications
      description: Note expected GAPIT semantics, numerical considerations, storage backends, or API compatibility concerns.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
