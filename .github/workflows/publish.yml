name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.release-notes.outputs.prerelease }}
      release_body: ${{ steps.release-notes.outputs.release_body }}

    steps:
      - uses: actions/checkout@v7

      - id: release-notes
        name: Generate release notes
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = context.ref.replace('refs/tags/', '');
            const version = currentTag.replace(/^v/, '');
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });
            const currentIndex = tags.findIndex(({ name }) => name === currentTag);
            const previousTag = currentIndex >= 0
              ? tags[currentIndex + 1]?.name
              : undefined;
            const parameters = {
              owner,
              repo,
              tag_name: currentTag,
            };
            if (previousTag) {
              parameters.previous_tag_name = previousTag;
            }
            const generated = await github.rest.repos.generateReleaseNotes(parameters);
            const prerelease = /(?:a|b|rc)\d+|\.dev\d+/.test(version);
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const heading = `## [${version}]`;
            const start = changelog.findIndex(
              (line) => line === heading || line.startsWith(`${heading} - `),
            );
            let releaseBody = generated.data.body || '';
            if (start >= 0) {
              const following = changelog.slice(start + 1);
              const nextHeading = following.findIndex((line) => line.startsWith('## ['));
              const end = nextHeading >= 0 ? start + 1 + nextHeading : changelog.length;
              const narrative = changelog.slice(start + 1, end).join('\n').trim();
              if (narrative) {
                releaseBody = releaseBody
                  ? `${narrative}\n\n---\n\n${releaseBody}`
                  : narrative;
              }
            }

            core.setOutput('prerelease', prerelease);
            core.setOutput('release_body', releaseBody);
            core.info(
              `Prepared release notes for ${currentTag}`
              + (previousTag ? ` after ${previousTag}.` : '.'),
            );

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Install and smoke-test distributions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pygapit-wheel-test"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/pygapit" --help

          python -m venv "$RUNNER_TEMP/pygapit-sdist-test"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/pygapit" --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pygapit-ng

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-github:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare-release, build, publish-pypi]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BODY: ${{ needs.prepare-release.outputs.release_body }}
          RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          release_title="pyGAPIT ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            prerelease_args=()
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --notes "$RELEASE_BODY" \
              "${prerelease_args[@]}" \
              --title "$release_title"
          fi
