name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "MIGRATING.md"
      - "API_FREEZE_2.0.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Static quality gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ruff, BasedPyright, and Pyrefly
        run: pixi run precommit

  package:
    name: Build and install distributions
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test distributions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pygapit-wheel-test"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/pygapit" --help

          python -m venv "$RUNNER_TEMP/pygapit-sdist-test"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/pygapit" --help

  quality:
    name: Main tests and coverage
    runs-on: ubuntu-24.04
    needs: lint
    env:
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default full312
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Verify bigdata dependencies
        run: pixi run python -c "import h5py, zarr"

      - name: Python tests with coverage
        run: pixi run pytest tests -q --ignore=tests/cross_language --cov=pygapit --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Storage tests on minimum Python
        run: pixi run -e full312 pytest tests/test_genotype_storage.py -q

  windows:
    name: Windows x64 Python ${{ matrix.python-version }} (base dependencies)
    runs-on: windows-2025
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1"

      - name: Verify optional dependencies are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('dask', 'h5py', 'zarr'))"

      - name: Python tests with base dependencies
        run: pytest tests -q --ignore=tests/cross_language

  optional-extras:
    name: bigdata and styles extras on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bigdata,styles]" "pytest>=9.1.1"

      - name: Verify optional modules import
        run: python -c "import h5py, scienceplots, seaborn, zarr"

      - name: Tests with optional extras
        run: pytest tests -q --ignore=tests/cross_language

  platform-smoke:
    name: ${{ matrix.name }} Python 3.12 bigdata smoke
    runs-on: ${{ matrix.runner }}
    needs: [lint, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-14

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: full312
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Show platform architecture
        run: pixi run -e full312 python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Verify optional storage modules import
        run: pixi run -e full312 python -c "import h5py, zarr"

      - name: Storage and core tests
        run: pixi run -e full312 pytest tests/test_genotype_storage.py tests/test_pygapit.py -q

  lowest-dependencies:
    name: Lowest direct dependencies on Python 3.12
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -c .github/constraints/lowest.txt \
            -e ".[bigdata,styles]" \
            "pytest>=9.1.1"

      - name: Verify direct dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          for requirement in Path(".github/constraints/lowest.txt").read_text().splitlines():
              package, expected = requirement.split("==", 1)
              assert version(package) == expected, (package, version(package), expected)
          PY

      - name: Tests at the declared dependency floors
        run: pytest tests -q --ignore=tests/cross_language

  parity:
    name: GAPIT 3.5 parity
    runs-on: ubuntu-24.04
    needs: [lint, quality]
    env:
      PYGAPIT_REQUIRE_R_ALIGNMENT: "1"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Configure R shared library
        shell: bash
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ensure R dependencies
        run: |
          Rscript -e "if (!requireNamespace('MASS', quietly = TRUE)) install.packages('MASS', repos = 'https://cloud.r-project.org')"

      - name: Show pinned GAPIT source
        run: git submodule status GAPIT

      - name: Cross-language tests
        run: pixi run pytest tests/cross_language -q

  ci-success:
    name: All checks passed
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - lint
      - package
      - quality
      - windows
      - optional-extras
      - platform-smoke
      - lowest-dependencies
      - parity

    steps:
      - name: Verify all upstream jobs succeeded
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $JOB_RESULTS"
          for result in $JOB_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "One or more CI jobs did not succeed."
              exit 1
            fi
          done
