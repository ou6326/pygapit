name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  package:
    name: Build and install distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test distributions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pygapit-wheel-test"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/pygapit" --help

          python -m venv "$RUNNER_TEMP/pygapit-sdist-test"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-sdist-test/bin/pygapit" --help

  quality:
    name: Quality and bigdata tests
    runs-on: ubuntu-latest
    env:
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default full312
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ruff
        run: |
          pixi run ruff check .
          pixi run ruff format --check .

      - name: BasedPyright
        run: pixi run basedpyright

      - name: Pyrefly
        run: pixi run pyrefly check -p all

      - name: Verify bigdata dependencies
        run: pixi run python -c "import h5py, zarr"

      - name: Python tests with bigdata dependencies
        run: pixi run pytest tests -q --ignore=tests/cross_language

      - name: Storage tests on minimum Python
        run: pixi run -e full312 pytest tests/test_genotype_storage.py -q

  windows:
    name: Windows Python ${{ matrix.python-version }} (base dependencies)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1"

      - name: Verify optional dependencies are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('dask', 'h5py', 'zarr'))"

      - name: Python tests with base dependencies
        run: pytest tests -q --ignore=tests/cross_language

  bigdata:
    name: bigdata extra on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the bigdata extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bigdata]" "pytest>=9.1.1"

      - name: Verify optional storage modules import
        run: python -c "import h5py, zarr"

      - name: Tests with the bigdata extra
        run: pytest tests -q --ignore=tests/cross_language

  styles:
    name: styles extra on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the styles extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[styles]" "pytest>=9.1.1"

      - name: Verify optional style modules import
        run: python -c "import seaborn, scienceplots"

      - name: Tests with the styles extra
        run: pytest tests -q --ignore=tests/cross_language

  lowest-dependencies:
    name: Lowest direct dependencies on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -c .github/constraints/lowest.txt \
            -e ".[bigdata,styles]" \
            "pytest>=9.1.1"

      - name: Verify direct dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          for requirement in Path(".github/constraints/lowest.txt").read_text().splitlines():
              package, expected = requirement.split("==", 1)
              assert version(package) == expected, (package, version(package), expected)
          PY

      - name: Tests at the declared dependency floors
        run: pytest tests -q --ignore=tests/cross_language

  parity:
    name: GAPIT 3.5 parity
    runs-on: ubuntu-latest
    env:
      PYGAPIT_REQUIRE_R_ALIGNMENT: "1"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2

      - name: Configure R shared library
        shell: bash
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ensure R dependencies
        run: |
          Rscript -e "if (!requireNamespace('MASS', quietly = TRUE)) install.packages('MASS', repos = 'https://cloud.r-project.org')"

      - name: Show pinned GAPIT source
        run: git submodule status GAPIT

      - name: Cross-language tests
        run: pixi run pytest tests/cross_language -q
