name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality and Python tests
    runs-on: ubuntu-latest
    env:
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: BasedPyright
        run: basedpyright

      - name: Pyrefly
        run: pyrefly check -p all

      - name: Python tests
        run: pytest tests -q --ignore=tests/cross_language

  windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1"

      - name: Python tests
        run: pytest tests -q --ignore=tests/cross_language

  parity:
    name: GAPIT 3.5 parity
    runs-on: ubuntu-latest
    env:
      PYGAPIT_REQUIRE_R_ALIGNMENT: "1"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2

      - name: Configure R shared library
        shell: bash
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure R dependencies
        run: |
          Rscript -e "if (!requireNamespace('MASS', quietly = TRUE)) install.packages('MASS', repos = 'https://cloud.r-project.org')"

      - name: Install project and parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned GAPIT source
        run: git submodule status GAPIT

      - name: Cross-language tests
        run: pytest tests/cross_language -q
