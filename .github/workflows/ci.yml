name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  package:
    name: Build and install distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pygapit-wheel-test"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/python" -c "import pygapit; print(pygapit.__version__)"
          "$RUNNER_TEMP/pygapit-wheel-test/bin/pygapit" --help

  quality:
    name: Quality and Python tests
    runs-on: ubuntu-latest
    env:
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: full
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ruff
        run: |
          pixi run -e full ruff check .
          pixi run -e full ruff format --check .

      - name: BasedPyright
        run: pixi run -e full basedpyright

      - name: Pyrefly
        run: pixi run -e full pyrefly check -p all

      - name: Python tests
        run: pixi run -e full pytest tests -q --ignore=tests/cross_language

  windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1"

      - name: Python tests
        run: pytest tests -q --ignore=tests/cross_language

  parity:
    name: GAPIT 3.5 parity
    runs-on: ubuntu-latest
    env:
      PYGAPIT_REQUIRE_R_ALIGNMENT: "1"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2

      - name: Configure R shared library
        shell: bash
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: full
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true

      - name: Ensure R dependencies
        run: |
          Rscript -e "if (!requireNamespace('MASS', quietly = TRUE)) install.packages('MASS', repos = 'https://cloud.r-project.org')"

      - name: Show pinned GAPIT source
        run: git submodule status GAPIT

      - name: Cross-language tests
        run: pixi run -e full pytest tests/cross_language -q
